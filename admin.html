<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1020">
<title>Chats · DarooCell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#F7B41B;--bg:#0B1020;--g:#111729;--g2:#1d2540;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#fff;font-size:15px}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--g);border:1px solid rgba(247,180,27,.2);border-radius:20px;padding:30px 26px}
.card h1{font-size:1.4rem;margin-bottom:4px}.card p{opacity:.65;font-size:.9rem;margin-bottom:22px}
.card label{display:block;font-size:.82rem;font-weight:600;margin:14px 0 6px}
.card input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:#fff;font:inherit}
.btn{width:100%;margin-top:22px;padding:13px;border:0;border-radius:12px;background:var(--y);color:var(--bg);font-weight:800}
.btn:disabled{opacity:.6}
#lerr{color:#ff8a8a;font-size:.85rem;margin-top:12px;min-height:1em}
#app{display:flex;height:100dvh}
#side{width:340px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--g)}
.top{display:flex;align-items:center;gap:6px;padding:14px;border-bottom:1px solid var(--line)}
.top h2{flex:1;font-size:1.1rem}
.chip{background:none;border:1px solid var(--line);color:#fff;padding:6px 10px;border-radius:9px;font-size:.78rem}
.chip:hover{border-color:var(--y)}
#list{flex:1;overflow-y:auto}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:#fff;padding:13px 16px}
.row:hover,.row.on{background:var(--g2)}
.r1{display:flex;gap:8px;align-items:center}.r1 b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 time{font-size:.74rem;opacity:.55}
.r2{display:flex;gap:8px;margin-top:3px;align-items:center}
.pv{flex:1;font-size:.84rem;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--y);color:var(--bg);font-weight:800;font-size:.72rem;border-radius:10px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px}
.none{padding:30px 20px;opacity:.6;text-align:center;font-size:.9rem}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#empty{margin:auto;opacity:.5;padding:20px;text-align:center}
#conv{display:flex;flex-direction:column;height:100%}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--g)}
.ch b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{display:none}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px}
.m{max-width:min(78%,520px);padding:10px 13px;border-radius:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.m time{display:block;font-size:.68rem;opacity:.55;margin-top:3px}
.m.v{align-self:flex-start;background:var(--g2);border-bottom-left-radius:5px}
.m.a{align-self:flex-end;background:var(--y);color:var(--bg);border-bottom-right-radius:5px}
.comp{display:flex;gap:8px;align-items:flex-end;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--g)}
#in{flex:1;resize:none;max-height:140px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:#fff;font:inherit;line-height:1.35}
#send{padding:0 20px;height:44px;border:0;border-radius:12px;background:var(--y);color:var(--bg);font-weight:800}
@media(max-width:760px){
 #side{width:100%;border:0}#main{display:none;width:100%}
 #app.show #side{display:none}#app.show #main{display:flex}
 #back{display:inline-block}
}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="card" id="lform">
    <h1>Panel de chats</h1>
    <p>DarooCell · acceso privado</p>
    <label for="le">Email</label>
    <input id="le" type="email" value="daroo.cell@gmail.com" autocomplete="username" required>
    <label for="lp">Contraseña</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn" id="lbtn" type="submit">Entrar</button>
    <div id="lerr" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="top">
      <h2>Chats</h2>
      <button class="chip" id="bnot" type="button">Activar avisos</button>
      <button class="chip" id="bpw" type="button">Clave</button>
      <button class="chip" id="bout" type="button">Salir</button>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="empty">Elegí un chat de la lista para responder.</div>
    <div id="conv" hidden>
      <div class="ch">
        <button class="chip" id="back" type="button">&larr; Chats</button>
        <b id="cname"></b>
        <button class="chip" id="bdel" type="button">Eliminar</button>
      </div>
      <div id="msgs"></div>
      <div class="comp">
        <textarea id="in" rows="1" placeholder="Respondé como Dario…" aria-label="Respuesta"></textarea>
        <button id="send" type="button">Enviar</button>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var URL='https://xmpedfrpjblabbvrqqiu.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcGVkZnJwamJsYWJidnJxcWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjI2MDEsImV4cCI6MjExMDY5ODYwMX0.L482o-oh-uX-NgkP_ywKvRHIPMJeKOWyPDFu9UkyqHs';
var sb=supabase.createClient(URL,KEY);
var $=function(i){return document.getElementById(i)};
var convs={},prev={},cur=null,shown={},started=false,pending=0,baseTitle=document.title,actx=null;

function fmt(s){var d=new Date(s),n=new Date();
  return d.toDateString()===n.toDateString()?d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})}
function nm(c){return c.visitor_name||('Cliente '+c.id.slice(0,4))}

/* ---------- Sesión ---------- */
sb.auth.getSession().then(function(r){r.data.session?start():$('login').hidden=false});
$('lform').addEventListener('submit',function(e){
  e.preventDefault();var b=$('lbtn');b.disabled=true;$('lerr').textContent='';
  sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value}).then(function(r){
    b.disabled=false;
    if(r.error){$('lerr').textContent='Email o contraseña incorrectos.';return}
    $('login').hidden=true;start();
  });
});
$('bout').onclick=function(){sb.auth.signOut().then(function(){location.reload()})};
$('bpw').onclick=function(){
  var p=prompt('Nueva contraseña (mínimo 8 caracteres):');if(!p)return;
  if(p.length<8){alert('Tiene que tener al menos 8 caracteres.');return}
  sb.auth.updateUser({password:p}).then(function(r){alert(r.error?'No se pudo cambiar la contraseña.':'Contraseña actualizada.')});
};
$('bnot').onclick=function(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(window.Notification&&Notification.permission!=='granted')Notification.requestPermission().then(function(p){$('bnot').textContent=p==='granted'?'Avisos activos':'Avisos bloqueados'});
};

/* ---------- Datos ---------- */
function start(){
  $('app').hidden=false;
  if(window.Notification&&Notification.permission==='granted')$('bnot').textContent='Avisos activos';
  loadAll();
  sb.channel('chat')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},function(p){onMsg(p.new)})
    .on('postgres_changes',{event:'*',schema:'public',table:'chat_conversations'},function(p){
      if(p.eventType==='DELETE'){delete convs[p.old.id];if(cur===p.old.id)closeConv()}else convs[p.new.id]=p.new;
      renderList();
    }).subscribe();
  setInterval(loadAll,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){pending=0;document.title=baseTitle}});
}
function loadAll(){
  Promise.all([
    sb.from('chat_conversations').select('*').order('last_message_at',{ascending:false}),
    sb.from('chat_messages').select('id,conversation_id,sender,body').order('id',{ascending:false}).limit(300)
  ]).then(function(r){
    if(r[0].error||r[1].error)return;
    convs={};r[0].data.forEach(function(c){convs[c.id]=c});
    prev={};r[1].data.forEach(function(m){if(!prev[m.conversation_id])prev[m.conversation_id]=m});
    renderList();
  });
}
function renderList(){
  var l=$('list'),ids=Object.keys(convs).sort(function(a,b){return convs[b].last_message_at.localeCompare(convs[a].last_message_at)});
  l.textContent='';
  if(!ids.length){var n=document.createElement('div');n.className='none';n.textContent='Todavía no hay chats. Cuando un cliente escriba desde la web, va a aparecer acá.';l.appendChild(n);return}
  ids.forEach(function(id){
    var c=convs[id],p=prev[id],b=document.createElement('button');
    b.className='row'+(id===cur?' on':'');
    var r1=document.createElement('div');r1.className='r1';
    var t=document.createElement('b');t.textContent=nm(c);
    var tm=document.createElement('time');tm.textContent=fmt(c.last_message_at);
    r1.appendChild(t);r1.appendChild(tm);
    var r2=document.createElement('div');r2.className='r2';
    var pv=document.createElement('span');pv.className='pv';pv.textContent=p?((p.sender==='admin'?'Vos: ':'')+p.body):'';
    r2.appendChild(pv);
    if(c.unread_admin>0&&id!==cur){var bd=document.createElement('span');bd.className='bd';bd.textContent=c.unread_admin;r2.appendChild(bd)}
    b.appendChild(r1);b.appendChild(r2);
    b.onclick=function(){openConv(id)};
    l.appendChild(b);
  });
}
function addMsg(m){
  if(shown[m.id])return;shown[m.id]=1;
  var d=document.createElement('div');d.className='m '+(m.sender==='admin'?'a':'v');
  d.appendChild(document.createTextNode(m.body));
  var t=document.createElement('time');t.textContent=fmt(m.created_at);d.appendChild(t);
  $('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight;
}
function markRead(id){
  if(convs[id])convs[id].unread_admin=0;
  sb.from('chat_conversations').update({unread_admin:0}).eq('id',id).then(function(){});
}
function openConv(id){
  cur=id;shown={};$('msgs').textContent='';
  $('empty').hidden=true;$('conv').hidden=false;$('cname').textContent=nm(convs[id]);
  $('app').classList.add('show');renderList();
  sb.from('chat_messages').select('*').eq('conversation_id',id).order('id').then(function(r){
    if(cur!==id||r.error)return;
    r.data.forEach(addMsg);markRead(id);renderList();$('in').focus();
  });
}
function closeConv(){cur=null;$('conv').hidden=true;$('empty').hidden=false;$('app').classList.remove('show');renderList()}
$('back').onclick=closeConv;
$('bdel').onclick=function(){
  if(!cur||!confirm('¿Eliminar este chat y todos sus mensajes?'))return;
  var id=cur;sb.from('chat_conversations').delete().eq('id',id).then(function(r){if(r.error)alert('No se pudo eliminar.');else{delete convs[id];closeConv()}});
};

/* ---------- Mensajes en vivo ---------- */
function onMsg(m){
  if(!convs[m.conversation_id]){loadAll()}
  prev[m.conversation_id]={id:m.id,conversation_id:m.conversation_id,sender:m.sender,body:m.body};
  if(m.conversation_id===cur){addMsg(m);if(m.sender==='visitor')markRead(cur)}
  if(m.sender==='visitor'&&(m.conversation_id!==cur||document.hidden))alertNew(m);
  renderList();
}
function alertNew(m){
  var c=convs[m.conversation_id],who=c?nm(c):'un cliente';
  try{if(actx){var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted')new Notification('Chat DarooCell',{body:'Nuevo mensaje de '+who})}catch(e){}
  if(document.hidden){pending++;document.title='('+pending+') '+baseTitle}
}

/* ---------- Responder ---------- */
function send(){
  var t=$('in').value.trim();if(!t||!cur)return;
  var b=$('send');b.disabled=true;
  sb.from('chat_messages').insert({conversation_id:cur,sender:'admin',body:t}).select().single().then(function(r){
    b.disabled=false;
    if(r.error){alert('No se pudo enviar. Revisá tu conexión.');return}
    $('in').value='';$('in').style.height='auto';addMsg(r.data);
    prev[cur]=r.data;renderList();
  });
}
$('send').onclick=send;
$('in').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px'});
</script>
</body>
</html>
