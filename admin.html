<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1020">
<title>Chats · DarooCell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#F7B41B;--bg:#0B1020;--g:#111729;--g2:#1d2540;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#fff;font-size:15px}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--g);border:1px solid rgba(247,180,27,.2);border-radius:20px;padding:30px 26px}
.card h1{font-size:1.4rem;margin-bottom:4px}.card p{opacity:.65;font-size:.9rem;margin-bottom:22px}
.card label{display:block;font-size:.82rem;font-weight:600;margin:14px 0 6px}
.card input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:#fff;font:inherit}
.btn{width:100%;margin-top:22px;padding:13px;border:0;border-radius:12px;background:var(--y);color:var(--bg);font-weight:800}
.btn:disabled{opacity:.6}
#lerr{color:#ff8a8a;font-size:.85rem;margin-top:12px;min-height:1em}
#app{display:flex;height:100dvh}
#side{width:340px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--g)}
.top{display:flex;align-items:center;gap:6px;padding:14px;border-bottom:1px solid var(--line)}
.top h2{flex:1;font-size:1.1rem}
.chip{background:none;border:1px solid var(--line);color:#fff;padding:6px 10px;border-radius:9px;font-size:.78rem}
.chip:hover{border-color:var(--y)}
#list{flex:1;overflow-y:auto}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:#fff;padding:13px 16px}
.row:hover,.row.on{background:var(--g2)}
.r1{display:flex;gap:8px;align-items:center}.r1 b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 time{font-size:.74rem;opacity:.55}
.r2{display:flex;gap:8px;margin-top:3px;align-items:center}
.pv{flex:1;font-size:.84rem;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--y);color:var(--bg);font-weight:800;font-size:.72rem;border-radius:10px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px}
.none{padding:30px 20px;opacity:.6;text-align:center;font-size:.9rem}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#empty{margin:auto;opacity:.5;padding:20px;text-align:center}
#conv{display:flex;flex-direction:column;height:100%}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--g)}
.ch b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{display:none}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px}
.m{max-width:min(78%,520px);padding:10px 13px;border-radius:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.m time{display:block;font-size:.68rem;opacity:.55;margin-top:3px}
.m.v{align-self:flex-start;background:var(--g2);border-bottom-left-radius:5px}
.m.a{align-self:flex-end;background:var(--y);color:var(--bg);border-bottom-right-radius:5px}
.comp{display:flex;gap:8px;align-items:flex-end;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--g)}
#in{flex:1;resize:none;max-height:140px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:#fff;font:inherit;line-height:1.35}
#send{padding:0 20px;height:44px;border:0;border-radius:12px;background:var(--y);color:var(--bg);font-weight:800}
@media(max-width:760px){
 #side{width:100%;border:0}#main{display:none;width:100%}
 #app.show #side{display:none}#app.show #main{display:flex}
 #back{display:inline-block}
}
.row.unr .r1 b{font-weight:800}
.comp{position:relative}
#sug{position:absolute;left:12px;right:12px;bottom:100%;margin-bottom:6px;background:#1d2540;border:1px solid rgba(247,180,27,.3);border-radius:12px;max-height:240px;overflow-y:auto;z-index:5}
.si{padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--line)}
.si.on,.si:hover{background:#2a3459}
.si b{color:var(--y);font-weight:600}
.si span{display:block;font-size:.8rem;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tmodal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.tbox{background:var(--g);border:1px solid rgba(247,180,27,.25);border-radius:16px;width:100%;max-width:640px;max-height:90dvh;overflow-y:auto;padding:20px}
.tbox h3{font-size:1.1rem;margin-bottom:4px}.tbox p{opacity:.65;font-size:.85rem;margin-bottom:14px}
.tr{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tr div{flex:1;min-width:0}.tr b{color:var(--y);font-weight:600}.tr span{display:block;font-size:.82rem;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbox label{display:block;font-size:.82rem;font-weight:600;margin:12px 0 5px}
.tbox input,.tbox textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:#fff;font:inherit}
.tbox textarea{min-height:190px;resize:vertical;line-height:1.4}
.tact{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.tact .btn{width:auto;margin:0;padding:10px 18px}
.ghost{background:none!important;border:1px solid var(--line)!important;color:#fff!important}
#bclose{display:inline-block}
@media(max-width:760px){#bclose{display:none}}
.ch{flex-wrap:wrap}.ch b{flex:1 1 110px}
.imgw{position:relative;border-radius:10px;overflow:hidden;width:260px;max-width:100%;min-height:90px;background:#0B1020}
.imgw img{display:block;width:100%;max-height:300px;object-fit:cover;filter:blur(24px);transform:scale(1.15);cursor:pointer}
.imgw.show img{filter:none;transform:none}
.imgw .vf{position:absolute;inset:0;width:100%;background:rgba(11,16,32,.45);border:0;color:#fff;font-weight:600}
.imgw.show .vf{display:none}
.iact{margin-top:6px}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="card" id="lform">
    <h1>Panel de chats</h1>
    <p>DarooCell · acceso privado</p>
    <label for="le">Email</label>
    <input id="le" type="email" placeholder="Email" autocomplete="username" required>
    <label for="lp">Contraseña</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn" id="lbtn" type="submit">Entrar</button>
    <div id="lerr" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="top">
      <h2>Chats</h2>
      <button class="chip" id="btpl" type="button">Plantillas</button>
      <button class="chip" id="bnot" type="button">Activar avisos</button>
      <button class="chip" id="bpw" type="button">Clave</button>
      <button class="chip" id="bout" type="button">Salir</button>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="empty">Elegí un chat de la lista para responder.</div>
    <div id="conv" hidden>
      <div class="ch">
        <button class="chip" id="back" type="button">&larr; Chats</button>
        <b id="cname"></b>
        <button class="chip" id="bunr" type="button">Marcar como no leído</button>
        <button class="chip" id="bblk" type="button">Bloquear</button>
        <button class="chip" id="bdel" type="button">Eliminar</button>
        <button class="chip" id="bclose" type="button">Cerrar</button>
      </div>
      <div id="msgs"></div>
      <div class="comp">
        <div id="sug" hidden></div>
        <textarea id="in" rows="1" placeholder="Respondé como Dario… (escribí / para usar plantillas)" aria-label="Respuesta"></textarea>
        <button id="send" type="button">Enviar</button>
      </div>
    </div>
  </main>
</div>

<div id="tmodal" hidden>
  <div class="tbox">
    <h3>Plantillas de respuesta</h3>
    <p>En el chat escribí / y el atajo para insertarla. Los datos entre [corchetes] se completan con la tecla Tab.</p>
    <div id="tlist"></div>
    <div id="tform" hidden>
      <label for="tsc">Atajo (sin la /)</label>
      <input id="tsc" maxlength="30" placeholder="presupuesto" autocomplete="off">
      <label for="tbody">Texto</label>
      <textarea id="tbody" maxlength="2000" placeholder="Hola [nombre]! ..."></textarea>
      <div id="terr" style="color:#ff8a8a;font-size:.85rem;margin-top:8px"></div>
      <div class="tact"><button class="btn ghost" id="tcancel" type="button">Cancelar</button><button class="btn" id="tsave" type="button">Guardar</button></div>
    </div>
    <div class="tact" id="tfoot"><button class="btn ghost" id="tclose" type="button">Cerrar</button><button class="btn" id="tnew" type="button">Nueva plantilla</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SB_URL='https://xmpedfrpjblabbvrqqiu.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcGVkZnJwamJsYWJidnJxcWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjI2MDEsImV4cCI6MjExMDY5ODYwMX0.L482o-oh-uX-NgkP_ywKvRHIPMJeKOWyPDFu9UkyqHs';
if(!window.supabase){document.body.innerHTML='<p style="padding:30px;font-family:sans-serif;color:#fff">No se pudo cargar el panel. Revisá tu conexión o desactivá el bloqueador de anuncios y recargá.</p>';throw new Error('supabase no cargó')}
var sb=supabase.createClient(SB_URL,KEY);
var $=function(i){return document.getElementById(i)};
var convs={},prev={},cur=null,shown={},started=false,pending=0,baseTitle=document.title,actx=null;

function fmt(s){var d=new Date(s),n=new Date();
  return d.toDateString()===n.toDateString()?d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})}
function nm(c){return c.visitor_name||('Cliente '+c.id.slice(0,4))}

/* ---------- Sesión ---------- */
sb.auth.getSession().then(function(r){r.data.session?start():$('login').hidden=false});
$('lform').addEventListener('submit',function(e){
  e.preventDefault();var b=$('lbtn');b.disabled=true;$('lerr').textContent='';
  sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value}).then(function(r){
    b.disabled=false;
    if(r.error){$('lerr').textContent='Email o contraseña incorrectos.';return}
    $('login').hidden=true;start();
  });
});
$('bout').onclick=function(){sb.auth.signOut().then(function(){location.reload()})};
$('bpw').onclick=function(){
  var p=prompt('Nueva contraseña (mínimo 8 caracteres):');if(!p)return;
  if(p.length<8){alert('Tiene que tener al menos 8 caracteres.');return}
  sb.auth.updateUser({password:p}).then(function(r){alert(r.error?'No se pudo cambiar la contraseña.':'Contraseña actualizada.')});
};
$('bnot').onclick=function(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(window.Notification&&Notification.permission!=='granted')Notification.requestPermission().then(function(p){$('bnot').textContent=p==='granted'?'Avisos activos':'Avisos bloqueados'});
};

/* ---------- Datos ---------- */
function start(){
  $('app').hidden=false;
  if(window.Notification&&Notification.permission==='granted')$('bnot').textContent='Avisos activos';
  loadAll();loadTpls();
  sb.channel('chat')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},function(p){onMsg(p.new)})
    .on('postgres_changes',{event:'*',schema:'public',table:'chat_conversations'},function(p){
      if(p.eventType==='DELETE'){delete convs[p.old.id];if(cur===p.old.id)closeConv()}else convs[p.new.id]=p.new;
      renderList();
    }).subscribe();
  setInterval(loadAll,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){pending=0;document.title=baseTitle}});
}
function loadAll(){
  Promise.all([
    sb.from('chat_conversations').select('*').order('last_message_at',{ascending:false}),
    sb.from('chat_messages').select('id,conversation_id,sender,body').order('id',{ascending:false}).limit(300)
  ]).then(function(r){
    if(r[0].error||r[1].error)return;
    convs={};r[0].data.forEach(function(c){convs[c.id]=c});
    prev={};r[1].data.forEach(function(m){if(!prev[m.conversation_id])prev[m.conversation_id]=m});
    renderList();
  });
}
function renderList(){
  var l=$('list'),ids=Object.keys(convs).sort(function(a,b){return convs[b].last_message_at.localeCompare(convs[a].last_message_at)});
  l.textContent='';
  if(!ids.length){var n=document.createElement('div');n.className='none';n.textContent='Todavía no hay chats. Cuando un cliente escriba desde la web, va a aparecer acá.';l.appendChild(n);return}
  ids.forEach(function(id){
    var c=convs[id],p=prev[id],b=document.createElement('button');
    b.className='row'+(id===cur?' on':'')+(c.unread_admin>0&&id!==cur?' unr':'');
    var r1=document.createElement('div');r1.className='r1';
    var t=document.createElement('b');t.textContent=nm(c);
    var tm=document.createElement('time');tm.textContent=fmt(c.last_message_at);
    r1.appendChild(t);r1.appendChild(tm);
    var r2=document.createElement('div');r2.className='r2';
    var pv=document.createElement('span');pv.className='pv';pv.textContent=p?((p.sender==='admin'?'Vos: ':'')+p.body):'';
    r2.appendChild(pv);
    if(c.unread_admin>0&&id!==cur){var bd=document.createElement('span');bd.className='bd';bd.textContent=c.unread_admin;r2.appendChild(bd)}
    b.appendChild(r1);b.appendChild(r2);
    b.onclick=function(){openConv(id)};
    l.appendChild(b);
  });
}
function addMsg(m){
  if(shown[m.id])return;shown[m.id]=1;
  var d=document.createElement('div');d.className='m '+(m.sender==='admin'?'a':'v');
  if(m.image_path){d.appendChild(imgBox(m))}else d.appendChild(document.createTextNode(m.body));
  var t=document.createElement('time');t.textContent=fmt(m.created_at);d.appendChild(t);
  $('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight;
}
function markRead(id){
  if(convs[id])convs[id].unread_admin=0;
  sb.from('chat_conversations').update({unread_admin:0}).eq('id',id).then(function(){});
}
function openConv(id){
  cur=id;shown={};$('msgs').textContent='';
  $('empty').hidden=true;$('conv').hidden=false;$('cname').textContent=nm(convs[id]);$('bblk').textContent=convs[id].blocked?'Desbloquear':'Bloquear';
  $('app').classList.add('show');renderList();
  sb.from('chat_messages').select('*').eq('conversation_id',id).order('id').then(function(r){
    if(cur!==id||r.error)return;
    r.data.forEach(addMsg);markRead(id);renderList();$('in').focus();
  });
}
function closeConv(){cur=null;$('conv').hidden=true;$('empty').hidden=false;$('app').classList.remove('show');renderList()}
$('back').onclick=closeConv;$('bclose').onclick=closeConv;
$('bdel').onclick=function(){
  if(!cur||!confirm('¿Eliminar este chat y todos sus mensajes?'))return;
  var id=cur;sb.from('chat_conversations').delete().eq('id',id).then(function(r){if(r.error)alert('No se pudo eliminar.');else{delete convs[id];closeConv()}});
};

/* ---------- Mensajes en vivo ---------- */
function onMsg(m){
  if(!convs[m.conversation_id]){loadAll()}
  prev[m.conversation_id]={id:m.id,conversation_id:m.conversation_id,sender:m.sender,body:m.body};
  if(m.conversation_id===cur){addMsg(m);if(m.sender==='visitor')markRead(cur)}
  if(m.sender==='visitor'&&(m.conversation_id!==cur||document.hidden))alertNew(m);
  renderList();
}
function alertNew(m){
  var c=convs[m.conversation_id],who=c?nm(c):'un cliente';
  try{if(actx){var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted')new Notification('Chat DarooCell',{body:'Nuevo mensaje de '+who})}catch(e){}
  if(document.hidden){pending++;document.title='('+pending+') '+baseTitle}
}

/* ---------- Responder ---------- */
function send(){
  var t=$('in').value.trim();if(!t||!cur)return;
  if(/\[[^\]]+\]/.test(t)&&!confirm('Todavía quedan datos entre [corchetes] sin completar. ¿Enviar igual?'))return;
  var b=$('send');b.disabled=true;
  sb.from('chat_messages').insert({conversation_id:cur,sender:'admin',body:t}).select().single().then(function(r){
    b.disabled=false;
    if(r.error){alert('No se pudo enviar. Revisá tu conexión.');return}
    $('in').value='';$('in').style.height='auto';addMsg(r.data);
    prev[cur]=r.data;renderList();
  });
}
$('send').onclick=send;

$('in').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px';showSug()});

/* ---------- No leído ---------- */
$('bunr').onclick=function(){
  if(!cur)return;var id=cur;
  sb.from('chat_conversations').update({unread_admin:1}).eq('id',id).then(function(r){
    if(r.error){alert('No se pudo marcar como no leído.');return}
    if(convs[id])convs[id].unread_admin=1;closeConv();
  });
};

/* ---------- Plantillas ---------- */
var tpls=[],sugL=[],sugI=0,editId=null,BR=/\[[^\]]+\]/g;
function loadTpls(){sb.from('chat_templates').select('*').order('shortcut').then(function(r){if(!r.error)tpls=r.data||[]})}
function ph(ta,from){BR.lastIndex=from;var x=BR.exec(ta.value);if(!x)return false;ta.focus();ta.setSelectionRange(x.index,x.index+x[0].length);return true}
function useTpl(t){
  var ta=$('in');ta.value=t.body;ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px';hideSug();
  if(!ph(ta,0)){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}
}
function hideSug(){$('sug').hidden=true;sugL=[]}
function drawSug(){
  var el=$('sug');el.textContent='';
  sugL.forEach(function(t,i){
    var d=document.createElement('div');d.className='si'+(i===sugI?' on':'');
    var b=document.createElement('b');b.textContent='/'+t.shortcut;
    var sp=document.createElement('span');sp.textContent=t.body.replace(/\s+/g,' ');
    d.appendChild(b);d.appendChild(sp);
    d.onmousedown=function(e){e.preventDefault();useTpl(t)};
    el.appendChild(d);
  });
  el.hidden=false;
}
function showSug(){
  var v=$('in').value;
  if(v.charAt(0)!=='/'||/\s/.test(v)){hideSug();return}
  var q=v.slice(1).toLowerCase();
  sugL=tpls.filter(function(t){return t.shortcut.indexOf(q)===0}).concat(tpls.filter(function(t){return t.shortcut.indexOf(q)>0}));
  if(!sugL.length){hideSug();return}
  sugI=0;drawSug();
}
$('in').addEventListener('keydown',function(e){
  if(!$('sug').hidden){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sugI=(sugI+(e.key==='ArrowDown'?1:sugL.length-1))%sugL.length;drawSug();return}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();useTpl(sugL[sugI]);return}
    if(e.key==='Escape'){hideSug();return}
  }
  if(e.key==='Tab'&&!e.shiftKey&&ph(this,this.selectionEnd)){e.preventDefault();return}
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});

function renderT(){
  var l=$('tlist');l.textContent='';
  if(!tpls.length){var n=document.createElement('div');n.className='none';n.textContent='Todavía no tenés plantillas. Creá la primera.';l.appendChild(n)}
  tpls.forEach(function(t){
    var r=document.createElement('div');r.className='tr';
    var d=document.createElement('div'),b=document.createElement('b'),sp=document.createElement('span');
    b.textContent='/'+t.shortcut;sp.textContent=t.body.replace(/\s+/g,' ');d.appendChild(b);d.appendChild(sp);
    var e=document.createElement('button');e.className='chip';e.textContent='Editar';e.onclick=function(){editT(t)};
    var x=document.createElement('button');x.className='chip';x.textContent='Borrar';x.onclick=function(){delT(t)};
    r.appendChild(d);r.appendChild(e);r.appendChild(x);l.appendChild(r);
  });
}
function editT(t){
  editId=t?t.id:null;$('tsc').value=t?t.shortcut:'';$('tbody').value=t?t.body:'';$('terr').textContent='';
  $('tform').hidden=false;$('tfoot').hidden=true;$('tsc').focus();
}
function endEdit(){$('tform').hidden=true;$('tfoot').hidden=false;renderT()}
function delT(t){
  if(!confirm('¿Borrar la plantilla /'+t.shortcut+'?'))return;
  sb.from('chat_templates').delete().eq('id',t.id).then(function(r){
    if(r.error){alert('No se pudo borrar.');return}
    tpls=tpls.filter(function(x){return x.id!==t.id});renderT();
  });
}
$('btpl').onclick=function(){renderT();$('tmodal').hidden=false};
$('tclose').onclick=function(){$('tmodal').hidden=true};
$('tnew').onclick=function(){editT(null)};
$('tcancel').onclick=endEdit;
$('tsave').onclick=function(){
  var sc=$('tsc').value.toLowerCase().replace(/^\/+/,'').replace(/\s+/g,'-').replace(/[^a-z0-9_-]/g,'');
  var body=$('tbody').value.trim();
  if(!sc||!body){$('terr').textContent='Completá el atajo y el texto.';return}
  var q=editId?sb.from('chat_templates').update({shortcut:sc,body:body}).eq('id',editId):sb.from('chat_templates').insert({shortcut:sc,body:body});
  q.then(function(r){
    if(r.error){$('terr').textContent=/duplicate|unique/i.test(r.error.message)?'Ya existe una plantilla con ese atajo.':'No se pudo guardar. Probá de nuevo.';return}
    sb.from('chat_templates').select('*').order('shortcut').then(function(x){if(!x.error)tpls=x.data||[];endEdit()});
  });
};

/* ---------- Fotos y bloqueo ---------- */
function imgBox(m){
  var h=document.createElement('div'),w=document.createElement('div');w.className='imgw';
  var im=document.createElement('img');im.alt='Foto del cliente';w.appendChild(im);
  var v=document.createElement('button');v.className='vf';v.type='button';v.textContent='Ver foto';w.appendChild(v);
  var a=document.createElement('div');a.className='iact';
  var del=document.createElement('button');del.className='chip';del.type='button';del.textContent='Eliminar foto';a.appendChild(del);
  h.appendChild(w);h.appendChild(a);
  var url='';
  sb.storage.from('chat-photos').createSignedUrl(m.image_path,3600).then(function(r){if(r.data){url=r.data.signedUrl;im.src=url}});
  v.onclick=function(){w.classList.add('show')};
  im.onclick=function(){if(w.classList.contains('show')&&url)window.open(url,'_blank')};
  del.onclick=function(){
    if(!confirm('¿Eliminar esta foto?'))return;
    sb.storage.from('chat-photos').remove([m.image_path])
      .then(function(){return sb.from('chat_messages').update({image_path:null,body:'Foto eliminada'}).eq('id',m.id)})
      .then(function(){h.textContent='Foto eliminada'});
  };
  return h;
}
$('bblk').onclick=function(){
  if(!cur)return;var id=cur,nv=!convs[id].blocked;
  if(nv&&!confirm('¿Bloquear a este cliente? No va a poder enviarte más mensajes ni fotos.'))return;
  sb.from('chat_conversations').update({blocked:nv}).eq('id',id).then(function(r){
    if(r.error){alert('No se pudo cambiar.');return}
    convs[id].blocked=nv;$('bblk').textContent=nv?'Desbloquear':'Bloquear';
  });
};
